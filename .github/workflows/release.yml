name: release

# A v* tag runs the full ci (ci.yml with `full`: Python 3.11 and 3.12 on Linux, macOS and Windows, the web and its
# end-to-end tests), and only once it passes builds the wheel and publishes it to PyPI. It is the one ci run: pull
# requests and main run none, and the team's machines follow main through the nightly tag (nightly.yml).
on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches evo_agents.__version__
        run: |
          version=$(python -c 'import evo_agents; print(evo_agents.__version__)')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match evo_agents.__version__ $version"
            exit 1
          fi

  ci:
    needs: version
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel works outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          smoke/bin/evo-agents --version
          smoke/bin/evo-agents kg --help >/dev/null
          smoke/bin/evo-agents hub --help >/dev/null
          smoke/bin/python -c 'from evo_agents.harness import load_schema; [load_schema(n) for n in ("harness", "contracts", "knowledge", "plan")]'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evo-ak/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub Release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A rerun of the job finds the release made and uploads the files again.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "evo-ak ${GITHUB_REF_NAME#v}"
          fi
