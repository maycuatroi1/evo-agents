name: ci

# Runs on a v* tag only, through release.yml, or by hand. A pull request and a push to main run no ci: the agent that
# makes a change tests the cases it puts at risk on its own machine, merges, and main deploys to the hub at once
# (deploy.yml). Two weights. The full one, which release.yml runs before it builds anything: Linux, macOS and Windows on
# Python 3.11 and 3.12, the web's checks and its end-to-end tests. The light one, a manual run without `full`: Linux on
# Python 3.12, the Python of the hub's image, and the web. No linter runs here: ruff, ESLint, import-linter and the
# structure budgets of tests/test_structure.py are commands to run when wanted (docs/structure.md).
on:
  workflow_call:
    inputs:
      full:
        description: "Python 3.11 too, and macOS and Windows"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: "Python 3.11 too, and macOS and Windows"
        type: boolean
        default: true

# A new push to a pull request cancels the run of the push before it; every other run goes to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request touches, so a change to web/ alone skips the Python tests and a change to the tests or the
  # docs alone skips the web. Every other run runs everything. The Python tests count every file outside web/ (they
  # read docs/, plugins/ and the harness files too) and the two files of web/ they read: package.json, which
  # tests/release/test_versions.py checks names no version, and README.md, which tests/hub/test_contract.py reads.
  # The web counts web/ and the package, since its end-to-end tests run against `hub serve` from this checkout, but
  # not the knowledge graph builder (evo_agents/kg/) or a markdown file: a pull request that changes only those, the
  # tests or the docs runs the Python tests alone, and its merge into main runs the web as every push does.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' || steps.filter.outputs.read_by_python == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      full: ${{ inputs.full == true }}
      pythons: ${{ inputs.full == true && '["3.11", "3.12"]' || '["3.12"]' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            python:
              - '**'
              - '!web/**'
            read_by_python:
              - 'web/package.json'
              - 'web/README.md'
            web:
              - 'web/**'
              - 'evo_agents/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
              - '!evo_agents/kg/**'
              - '!**/*.md'

  # Linux runs everything, the hub tests included, against a Postgres service container, in five jobs per Python that
  # run in parallel: tests/worker in one, where with the worker extra and tmux the daemon runs against a hub end to
  # end, takeover and handback in tmux included, and the rest of the suite in four parts (EVO_TEST_SHARD, which
  # tests/conftest.py reads: each part keeps every fourth test of the collection, so the four run each test once).
  # Every job prints its 20 slowest tests.
  #
  # The Postgres of a job is thrown away with it, so it keeps its data in memory (tmpfs) and writes nothing through:
  # every hub test creates a database from a template and drops it, and those writes cost more than most tests.
  test:
    name: test (ubuntu-latest, ${{ matrix.python }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.pythons) }}
        part: ["1/4", "2/4", "3/4", "4/4", worker]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - name: Postgres without fsync
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # uv installs into the interpreter setup-python put on PATH, which keeps its pip for tests/hub/test_wheel.py.
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,graphify,hub-server,worker]'
      # The core plugins the hub's image installs, after evo-ak (deploy/hub/core-plugins.txt): telegram and chats of
      # evo-agents-core-plugins, whose routes the golden copy of the API holds and with which tests build a hub's graph.
      - run: uv pip install --system --no-deps --require-hashes -r deploy/hub/core-plugins.txt
      - name: Install tmux, for the interactive runs of the worker
        if: matrix.part == 'worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - name: Part ${{ matrix.part }} of the tests outside tests/worker
        if: matrix.part != 'worker'
        env:
          EVO_TEST_SHARD: ${{ matrix.part }}
        run: pytest -q -n 4 --durations=20 --ignore=tests/worker
      - name: The worker daemon against a hub (tests/worker)
        if: matrix.part == 'worker'
        run: pytest -q -n 4 --durations=20 tests/worker

  # The plugin host as production runs it, which no other job reaches: as root in the hub's image with only the
  # capabilities of the plugins service (SETUID, SETGID, CHOWN, KILL), no-new-privileges, an init as pid 1 that holds
  # the hub's variables, and a fresh named volume at /plugins, so each backend gets a user of its own (isolation uid).
  # The tests of tests/plugins that start backends then run in that mode against the hostile, faulty, sample and
  # wheeled plugins, with tests/plugins/test_plugin_isolation_root.py, and `plugin test` checks the sample plugin.
  # tests/plugins/test_plugin_isolation_service.py starts `evo-agents hub plugin-host` itself, on the loop uvicorn picks
  # in this image (uvloop, from uvicorn[standard]), as the plugins service runs it; the other tests run on asyncio's.
  plugin-host-root:
    name: plugin-host-root
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The hub's image
        run: docker build -f deploy/hub/Dockerfile -t evo-agents-hub:ci .
      - name: The plugin tests as root with the plugins service's capabilities and limits
        run: |
          docker volume create evo-plugins-ci
          docker run --rm --init --user 0:0 --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add KILL \
            --security-opt no-new-privileges:true --cpus 1 --pids-limit 2048 --memory 2g \
            -e EVO_HUB_DSN=postgresql://hub:evo-hub-secret-dsn@db/hub \
            -e EVO_HUB_SECRETS_KEY=SECRETKEY-evo-hub-secret-sealing-key-000000 \
            -e EVO_HUB_PLUGIN_HOST_TOKEN=evo-hub-secret-host-token-0123456789abcdef \
            -e EVO_PLUGIN_HOST_TEST_ROOT=/plugins \
            -v evo-plugins-ci:/plugins -v "$PWD:/src:ro" -w /src \
            evo-agents-hub:ci sh -ec '
              pip install --no-cache-dir --quiet pytest
              python -m pytest -q -rs -p no:cacheprovider tests/plugins/test_plugin_isolation.py \
                tests/plugins/test_plugin_isolation_root.py tests/plugins/test_plugin_isolation_requirements.py \
                tests/plugins/test_plugin_isolation_service.py tests/plugins/test_plugin_protocol.py
              python -m evo_agents plugin test tests/fixtures/plugins/sample'

  # The hub's image with a core plugin of a hub's own (docs/hub-deployment.md, section Core plugins in the image): the
  # build argument EVO_HUB_EXTRA_CORE_PLUGINS names a wheel that a local index serves only with a fake credential,
  # which the build secret core_plugin_index carries. The hub of the image loads the plugin (core_install check, and
  # `evo-agents hub plugin list` against the image's api), and the credential is in neither `docker history`, the
  # build's log nor any layer of the image; a plugin that requires another core plugin API fails the build at check.
  # tests/plugins/test_core_install_image.py runs it all in Docker.
  core-plugins-image:
    name: core-plugins-image
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test]'
      - name: A core plugin from an index with a credential, built into the hub's image
        env:
          EVO_TEST_HUB_IMAGE: "1"
        run: pytest -q -rs -p no:cacheprovider tests/plugins/test_core_install_image.py

  # The tests of the core plugins deploy/hub/core-plugins.txt pins, telegram and chats: the repository
  # evo-agents-core-plugins at the tag of the pinned release, its tests run against this checkout of evo-agents in place
  # of the commit its evo-agents.lock names (`make setup` with EVO_AGENTS_URL and EVO_AGENTS_REF), on a Postgres service
  # as the test jobs'. A change of the hub that breaks them without changing the core plugin API fails here, not only
  # in that repository's nightly run against main.
  core-plugins-suite:
    name: core-plugins-suite
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - name: Postgres without fsync
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions/checkout@v4
        with:
          path: evo-agents
      - name: The release of evo-agents-core-plugins the pinned file names
        id: pinned
        run: |
          version=$(sed -n -E 's/^evo-agents-core-plugins==([^ ]+) .*/\1/p' evo-agents/deploy/hub/core-plugins.txt)
          test -n "$version" || { echo "deploy/hub/core-plugins.txt pins no evo-agents-core-plugins"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: maycuatroi1/evo-agents-core-plugins
          ref: ${{ steps.pinned.outputs.tag }}
          path: evo-agents-core-plugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: evo-agents/pyproject.toml
      - name: Its venv, with this checkout of evo-agents installed in place of the lock's commit
        working-directory: evo-agents-core-plugins
        run: make setup EVO_AGENTS_URL="$GITHUB_WORKSPACE/evo-agents" EVO_AGENTS_REF=HEAD
      - name: Its tests
        working-directory: evo-agents-core-plugins
        run: make test PYTEST_ARGS="-n 4 --durations=20"

  # The full run only. Service containers run on Linux only: macOS and Windows install the core package without the
  # hub-server and worker extras, and with EVO_HUB_TEST_DSN unset the hub tests skip, and so do the worker tests that
  # need a hub or the worker's SDKs.
  test-macos:
    name: test (macos-latest, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,graphify,worker]'
      - run: pytest -q

  test-windows:
    name: test (windows-latest, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[test,graphify,worker]"
      - run: python -m pytest -q -n 4 --durations=20

  # The web under web/ without a browser: the First Load JS budgets on a production build first, since they fail the
  # most often, then types, unit tests, and the drift check of the API types against the FastAPI OpenAPI, which needs
  # this checkout's Python but no database.
  web-check:
    name: web-check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHON: python
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,hub-server]'
        working-directory: .
      # The core plugins the hub's image installs, after evo-ak (deploy/hub/core-plugins.txt), so `pnpm gen:api` sees
      # the routes of Telegram that web/src/lib/api/schema.d.ts holds.
      - run: uv pip install --system --no-deps --require-hashes -r deploy/hub/core-plugins.txt
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build reuses what an earlier build of the same lockfile left, as the end-to-end tests' builds do.
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm build
      # First Load JS of every route against web/bundle-budget.json; a budget raised or a route added over main's file
      # needs a reason in its entry (web/scripts/bundle-budget.mjs).
      - name: First Load JS within its budget
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node scripts/bundle-budget.mjs --base origin/main
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types match the API
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts

  # Playwright (with axe) in six shards of 2 workers each (4 workers saturated a runner: a knowledge graph page's axe
  # test went from 14 s to over 30 s), each against a local hub on a Postgres service of its own (in memory, as the
  # test jobs') and a production build of its own, signing in through a fake GitHub. The specs seed what they read
  # under unique names, so a shard needs nothing from another. Every spec runs in Chromium; e2e/terminal.spec.ts runs
  # in Firefox too (playwright.config.ts).
  web-e2e:
    name: web-e2e (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
      PYTHON: python
    defaults:
      run:
        working-directory: web
    steps:
      - name: Postgres without fsync
        working-directory: .
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,hub-server,worker]'
        working-directory: .
      # The core plugins the hub's image installs, after evo-ak (deploy/hub/core-plugins.txt): the stack's hub serves
      # Telegram's routes, which e2e/telegram.spec.ts drives.
      - run: uv pip install --system --no-deps --require-hashes -r deploy/hub/core-plugins.txt
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build Playwright starts (`pnpm build && pnpm start`) reuses what an earlier build of the same lockfile left.
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
            web/e2e/.stack/hub-serve.log
          retention-days: 7

  # The check the main branch's ruleset requires: green when every job above passed or was skipped because the run is
  # light or the pull request does not touch what it tests, red when one failed or was cancelled, or when `changes`
  # itself did not run.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - test
      - plugin-host-root
      - core-plugins-image
      - core-plugins-suite
      - test-macos
      - test-windows
      - web-check
      - web-e2e
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")'
