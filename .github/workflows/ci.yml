name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the push before it; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request touches, so a change to web/ alone skips the Python tests and a change to the tests or the
  # docs alone skips the web. A push to main runs everything. The Python tests count every file outside web/ (they read
  # docs/, plugins/ and the harness files too) and the two files of web/ they read: package.json, whose version
  # tests/release/test_versions.py matches with the package's, and README.md, which tests/hub/test_contract.py reads.
  # The web counts web/ and the whole package, since its end-to-end tests run against `hub serve` from this checkout.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' || steps.filter.outputs.read_by_python == 'true' }}
      web: ${{ github.event_name == 'push' || steps.filter.outputs.web == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            python:
              - '**'
              - '!web/**'
            read_by_python:
              - 'web/package.json'
              - 'web/README.md'
            web:
              - 'web/**'
              - 'evo_agents/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  # Linux runs everything, the hub tests included, against a Postgres service container: with the worker extra and
  # tmux, tests/worker runs the daemon against a hub end to end, takeover and handback in tmux included.
  test:
    name: test (ubuntu-latest, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # uv installs into the interpreter setup-python put on PATH, which keeps its pip for tests/hub/test_wheel.py.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,graphify,hub-server,worker]'
      - name: Install tmux, for the interactive runs of the worker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --ignore=tests/worker
      - name: The worker daemon against a hub (tests/worker)
        run: pytest -q tests/worker

  # Service containers run on Linux only. macOS installs the core package without the hub-server and worker extras,
  # and with EVO_HUB_TEST_DSN unset the hub tests skip, and so do the worker tests that need a hub or the worker's SDKs.
  test-macos:
    name: test (macos-latest, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,graphify]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The web under web/ without a browser: lint, types, unit tests, and the drift check of the API types against the
  # FastAPI OpenAPI, which needs this checkout's Python but no database.
  web-check:
    name: web-check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,hub-server]'
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types match the API
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts

  # Playwright (with axe) in four shards, each against a local hub on a Postgres service of its own and a production
  # build of its own, signing in through a fake GitHub. The specs seed what they read under unique names, so a shard
  # needs nothing from another. Every spec runs in Chromium; e2e/terminal.spec.ts runs in Firefox too
  # (playwright.config.ts).
  web-e2e:
    name: web-e2e (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
      PYTHON: python
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[test,hub-server]'
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build Playwright starts (`pnpm build && pnpm start`) reuses what an earlier build of the same lockfile left.
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
            web/e2e/.stack/hub-serve.log
          retention-days: 7

  # The check the main branch's ruleset requires: green when every job above passed or was skipped because the pull
  # request does not touch what it tests, red when one failed or was cancelled, or when `changes` itself did not run.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, test, test-macos, web-check, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")'
