name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux runs everything, the hub tests included, against a Postgres service container: with the worker extra and
  # tmux, tests/worker runs the daemon against a hub end to end, takeover and handback in tmux included.
  test:
    name: test (ubuntu-latest, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,graphify,hub-server,worker]'
      - name: Install tmux, for the interactive runs of the worker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --ignore=tests/worker
      - name: The worker daemon against a hub (tests/worker)
        run: pytest -q tests/worker

  # Service containers run on Linux only. macOS installs the core package without the hub-server and worker extras,
  # and with EVO_HUB_TEST_DSN unset the hub tests skip, and so do the worker tests that need a hub or the worker's SDKs.
  test-macos:
    name: test (macos-latest, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,graphify]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The web under web/: lint, types, unit tests, the drift check of the API types against the FastAPI OpenAPI, and
  # Playwright (with axe) against a local hub on the Postgres service, signing in through a fake GitHub.
  web:
    name: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
      PYTHON: python
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test,hub-server]'
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API types match the API
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      # Every spec runs in Chromium; e2e/terminal.spec.ts runs in Firefox too (playwright.config.ts).
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            web/e2e/.stack/hub-serve.log
          retention-days: 7
