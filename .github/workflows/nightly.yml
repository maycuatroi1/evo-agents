name: nightly

# The tag nightly: the newest commit of main whose ci passed on its push, moved there every night. The team's machines
# install from it, `uv tool install --force 'evo-ak[worker,graphify] @ git+<this repository>@nightly'`, and the
# update-evo-agents skill compares what a machine runs with it. It runs no ci of its own: the light ci of main
# already passed on the commit it points at, and the full one runs on a v* tag (release.yml). A manual run moves it now.
on:
  schedule:
    - cron: "0 19 * * *" # 02:00 in Vietnam
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Move nightly to the newest green commit of main
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          sha=$(gh api "$runs" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then
            echo "::error::no push to main has a green ci run"
            exit 1
          fi
          now=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/nightly" \
            --jq '[.[] | select(.ref == "refs/tags/nightly")][0].object.sha // empty')
          if [ "$now" = "$sha" ]; then
            echo "nightly is already ${sha::7}"
          elif [ -n "$now" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$sha" -F force=true >/dev/null
            echo "nightly moved from ${now::7} to ${sha::7}"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$sha" >/dev/null
            echo "nightly created at ${sha::7}"
          fi
          echo "nightly: [${sha::7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"
