name: nightly

# The tag nightly: the tip of main, moved there every night. The team's machines install from it,
# `uv tool install --force 'evo-ak[worker,graphify] @ git+<this repository>@nightly'`, and the update-evo-agents skill
# compares what a machine runs with it. No ci gates it: main runs none, and the full one runs on a v* tag
# (release.yml). A manual run moves it now.
#
# deploy.yml also moves it, through workflow_call with the commit it deployed: once Dokploy deployed main and
# /v1/health reports ok and that commit's schema, nightly points there, and the hub's next read of the tag (every
# minute) brings the idle workers to it. The caller passes no secret, so the job that writes the tag holds none of the
# environment production.
on:
  schedule:
    - cron: "0 19 * * *" # 02:00 in Vietnam
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: The commit to move nightly to; empty takes the tip of main.
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    # On the job, not the workflow: a workflow called by deploy.yml runs under the caller's run, and the group still
    # keeps the night's move and a deploy's move from running at once.
    concurrency:
      group: nightly
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYED: ${{ inputs.sha }}
    steps:
      - name: Move nightly to the tip of main, or to the commit deploy.yml deployed
        run: |
          if [ -n "$DEPLOYED" ]; then
            if ! [[ "$DEPLOYED" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::deploy.yml passed '$DEPLOYED', which is not the full sha of a commit"
              exit 1
            fi
            sha=$DEPLOYED
            echo "the deployment of ${sha::7} succeeded"
          else
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          fi
          now=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/nightly" \
            --jq '[.[] | select(.ref == "refs/tags/nightly")][0].object.sha // empty')
          if [ "$now" = "$sha" ]; then
            echo "nightly is already ${sha::7}"
          elif [ -n "$now" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$sha" -F force=true >/dev/null
            echo "nightly moved from ${now::7} to ${sha::7}"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$sha" >/dev/null
            echo "nightly created at ${sha::7}"
          fi
          echo "nightly: [${sha::7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"
