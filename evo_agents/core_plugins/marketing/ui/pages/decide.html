<!doctype html>
<html data-evo-resize="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Growth</title>
    <link rel="stylesheet" href="/v1/plugin-ui/kit/1/evo-ui.css" />
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        padding: 0;
        background: transparent;
      }
      .decide-panel {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--card, var(--surface));
        box-shadow: var(--shadow-raised);
      }
      .decide-head {
        display: flex;
        min-height: 48px;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1) var(--space-2);
        padding: var(--space-2) var(--space-4);
        border-bottom: 1px solid var(--border);
      }
      .decide-head h2 {
        margin: 0;
      }
      .decide-count {
        display: inline-flex;
        min-width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--attention-soft);
        color: var(--attention);
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .decide-list > li.decide-item {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: var(--space-2) var(--space-3);
        padding: var(--space-3) var(--space-4);
      }
      .decide-mark {
        display: grid;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        place-items: center;
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        color: var(--muted-foreground);
      }
      .decide-text {
        flex-basis: 16rem;
        min-width: 0;
      }
      .decide-text p {
        margin: 0;
      }
      .decide-tag {
        align-self: flex-start;
      }
    </style>
    <script src="/v1/plugin-ui/kit/1/evo-ui.js"></script>
    <script src="common.js" defer></script>
    <script src="marketing.js" defer></script>
    <script src="decide.js" defer></script>
  </head>
  <body>
    <main id="page"></main>
  </body>
</html>
