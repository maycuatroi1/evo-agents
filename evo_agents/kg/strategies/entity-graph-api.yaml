# Prose read as LightRAG reads it, its entities read by the build itself (docs/kg-strategies.md, "entity-graph-api").
# What entity-graph does, but the entities step calls an OpenAI-compatible endpoint (OpenRouter) from the build, on the
# hub too, with no run of an agent pool: the build reads the key from OPENROUTER_API_KEY, which the hub's build opens
# from a member's secret (evo_agents.hub.server.kg_entity_key) and never writes down. The text leaves for OpenRouter,
# so the project's policy must declare the llm-backend sink `llm` (a project made from an upload has it); an item whose
# label that sink does not clear is not sent, and without the sink every item is refused with a reason.
# Model and ceilings are multi-hop-api's: claude-haiku-5.5 at OpenRouter's price of 2026-11-05. Its reasoning is off:
# on 40 MuSiQue paragraphs (seed 7, 2026-11-05) it took 2,414 tokens out a paragraph with reasoning and 1,274 without,
# for 8.9 and 7.2 entities (multi-hop-api, whose reasoning is on: 2,232).
version: 1
name: entity-graph-api
description: Prose to look at as a graph of entities and relations, as entity-graph, with the entities and relations
  read by the build itself through an OpenAI-compatible endpoint (OpenRouter, anthropic/claude-haiku-5.5, key from a
  hub secret or OPENROUTER_API_KEY, through the llm-backend sink llm), so a build on the hub needs no run of an agent
  pool. The strategy to start prose with on the hub.
suits: [prose]
knowledge:
  ontology:
    node_kinds:
      - Actor          # a person or a role the text names
      - Creature       # an animal or another living being
      - Organization   # a company, team, institution or group
      - Place          # a country, city, site or address
      - Event          # something that happened or is planned, with a time
      - Concept        # an idea, term or feature the text defines or uses
      - Method         # a way, process or technique of doing something
      - Content        # a document, book, article, film or other work of words, sound or image
      - Data           # a figure, measure, dataset or record
      - Artifact       # a product, tool, device or other made thing
      - NaturalObject  # a thing of nature that is not alive
      - Other          # an entity of none of these types; its own type is in props.type
    relations:
      - relates_to     # two entities the text ties, with keywords, a description and a strength
settings:
  passage_from: 2500
  passage_chars: 1800
  embed_chars: 3000
  semantic_mode: index
  walk: {}
  entities:
    model: anthropic/claude-haiku-5.5
    url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    sink: llm
    style: lightrag
    reasoning: {enabled: false}
    node_kinds: [Actor, Creature, Organization, Place, Event, Concept, Method, Content, Data, Artifact, NaturalObject,
      Other]
    relations: [relates_to]
    price: {input: 0.1, output: 0.5}
    max_cost: 5.0
    jobs: 4
    synonym_threshold: 0.8
steps: [entities]
