risks:
  - risk: Phát hành nhầm một bản PyPI hỏng; số phiên bản đã đăng không dùng lại được.
    mitigation: >
      release.yml kiểm tag khớp __version__ và chạy pytest trước khi đăng; step 13 chạy python -m build và
      twine check ở máy; step 15 hỏi người dùng trước khi push tag. Bản hỏng thì yank và phát hành 0.1.1.
  - risk: Dữ liệu khách hàng hoặc định danh nội bộ lọt vào repo public evo-agents qua fixture, mẫu stdin của hook hay ca eval.
    mitigation: >
      Mẫu stdin ở step 10 bỏ nội dung trước khi commit; fixture và mock eval chỉ dùng dữ liệu tự tạo; quét chuỗi
      nhạy cảm trên toàn cây trước mỗi lần push (step 15). Số đo từ transcript meridai chỉ nằm trong báo cáo
      của harness riêng tư này.
  - risk: Hook gợi ý bật mặc định chèn gợi ý sai vào mọi phiên, hoặc làm chậm mỗi lần Grep.
    mitigation: >
      Chỉ gợi ý node status declared hoặc parsed thuộc các kind có tên; hạn chót 1,5 giây; tắt bằng
      EVO_KG_GREP_HINTS=0; step 19 đo độ trễ và tỉ lệ đúng. Nếu tỉ lệ đúng thấp, câu hỏi mở chuyển hook sang
      opt-in được trả lời bằng số đo đó.
  - risk: uvx khởi động lạnh lâu hơn thời gian chờ khởi động MCP, hoặc thêm độ trễ vào mỗi lần hook chạy.
    mitigation: >
      Step 18 làm ấm cache uvx trước phiên đầu; step 19 đo độ trễ qua đúng lệnh hook. Nếu p95 vượt 1,5 giây vì
      uvx, hook gọi evo-agents đã cài bằng uv tool install khi phiên bản khớp và chỉ lùi về uvx khi không khớp.
  - risk: Schema kho 2 hoặc khoá PG-Keys làm build của một dự án thật thất bại.
    mitigation: >
      Kho schema cũ được dựng lại từ nhật ký (step 3); step 3 chạy build --verify trên cả ba dự án trước khi
      merge, Symbol trùng khoá được sửa ở harness tương ứng (step 16, 17).
  - risk: LaunchAgent chạy sync Lark trong môi trường launchd thiếu PATH hoặc credential, thất bại lặng lẽ.
    mitigation: >
      Plist khai PATH tường minh; lỗi đi vào schedule.log, audit.jsonl và exit code của kg status; step 18 chờ
      lượt chạy theo lịch đầu tiên và kiểm cả hai file.
  - risk: Sửa meridai-harness hoặc evo-lms-harness đè lên thay đổi chưa commit của phiên khác.
    mitigation: Làm trong worktree riêng; kiểm git status của checkout chính trước khi merge fast-forward.

rollback: >
  evo-agents: revert commit merge của nhánh kg-assertion-layer trên main; bản 0.1.0 trên PyPI không xoá được,
  chỉ yank, và plugin quay về ghim bản cũ bằng một commit. Kho schema 2: xoá graph.sqlite của dự án rồi dựng
  lại bằng phiên bản cũ từ nhật ký, vì nhật ký và blob không đổi định dạng. LaunchAgent: `evo-agents kg
  schedule uninstall` (launchctl bootout rồi xoá plist). meridai-harness và evo-lms-harness: revert commit
  knowledge.yaml; evo-lms đưa ghim CI về commit 1447e3f. Không có thao tác nào sửa corpus đã có.

assumptions:
  - uv và uvx có ở ~/.local/bin (kiểm 2026-10-03).
  - Lệnh meridai đã cài trên máy có kg-connector (kiểm 2026-10-03), nên LaunchAgent gọi được connector Lark.
  - Corpus có khoá theo nguồn (corpus.lock), nên lượt sync theo lịch và lượt sync tay không chạy chồng lên nhau.
  - Tên evo-ak trên PyPI còn trống (pypi.org/pypi/evo-ak/json và các biến thể chuẩn hoá trả 404 ngày 2026-10-03). Tên evo-agents bị PyPI từ chối vì quá giống project evoagents đã có.
  - Claude Code hỗ trợ additionalContext và trường if cho hook PreToolUse theo tài liệu hooks tra ngày 2026-10-03; step 11 kiểm lại trên bản cài thật.

