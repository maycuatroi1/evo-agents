# Copy of plans/completed/kg-assertion-layer.yaml of the evo-agents-harness repo, taken 2026-10-04, with internal
# names, a personal path and the location of a secret replaced by [redacted]. Test data for tests/hub.
id: kg-assertion-layer
goal: >
  Knowledge graph được dùng hằng ngày trên máy này: evo-agents phát hành trên PyPI và plugin evo-kg ghim
  đúng phiên bản; tầng khẳng định có đủ kg_impact, kg_path, kiểm ontology, khoá PG-Keys, định nghĩa từ
  frontmatter, node thư mục và lint quy ước định danh; LaunchAgent tự sync theo refresh của từng nguồn và
  ghi bản kiểm toán; hai hook mới cộng dồn nhãn phiên và gợi ý ID từ graph trước Grep, đã đo trên meridai.

created_at: '2026-10-03T14:30:00+07:00'

context: >
  Plan kg-prototype (giai đoạn 3) xong 13/13 bước và đóng ngày 2026-10-03; nó chỉ phủ mục 8 của
  reports/Thiết kế khung knowledge graph.md. Đối chiếu ngày 2026-10-03 giữa thiết kế (mục 3 đến 5) và code
  evo-agents ở main 1447e3f (48 test xanh) cho thấy ba nhóm thiếu. (1) Chưa dùng được hằng ngày: evo-agents
  không có trên PATH, plugins/evo-kg/.mcp.json gọi `evo-agents` không ghim phiên bản nên MCP server không
  khởi động trong phiên thường, hook SessionStart im lặng vì `|| true`; repo chưa có tag, phiên bản 0.0.1;
  lệnh kg bind ghi trong step 8 của kg-prototype chưa tồn tại. (2) Tầng khẳng định còn hở: MCP server chỉ có
  5 trên 9 tool (thiếu kg_path, kg_impact); evo_agents/kg/schema.py có validate_ontology nhưng không nơi nào
  gọi, dù knowledge.schema.json đã có khoá ontology; kho chưa có partial unique index cho Symbol; frontmatter
  id: chưa được coi là nơi định nghĩa nên 734 node Requirement SRS.<hex> của evo-lms không có cạnh defines;
  graph chưa có node thư mục, nguyên nhân chính của mention treo ở kb-docs của meridai; harness validate chưa
  lint quy ước ở mục 4.6; khoá refresh có trong schema nhưng không lệnh nào đọc; chưa có bản kiểm toán
  JSONL. (3) Plugin chỉ có hook SessionStart. Corpus đã có khoá theo nguồn (corpus.lock) và bảng runs, nên
  sync theo lịch không chạy chồng lên sync tay. CI Harness Validate của evo-lms ghim evo-agents theo commit
  1447e3f, và mọi thay đổi schema tới evo-lms qua một lần nâng ghim có review.

acceptance:
  - criterion: >
      evo-agents 0.1.0 có trên PyPI dưới tên evo-ak, phát hành từ tag v0.1.0 qua GitHub Actions; plugin evo-kg
      0.1.0 khởi động MCP server và các hook bằng `uvx --from evo-ak==0.1.0 evo-agents` trong một phiên Claude Code thường (không
      --plugin-dir) mở trong meridai-harness, và phiên đó gọi được kg_status.
    verify: >
      uvx --from evo-ak==0.1.0 evo-agents --version; claude plugin install evo-kg@evo-agents; trong ~/github/meridai-harness:
      claude -p "gọi kg_status rồi in tên dự án đã gắn" phải in meridai
  - criterion: >
      kg_impact trả phụ thuộc ngược từ một symbol, một danh sách đường dẫn hoặc một unified diff, chỉ qua
      cạnh tầng A (không có status proposed), độ sâu tối đa 3; kg_path trả chuỗi truy vết tối đa 6 hop giữa
      hai node hoặc từ một node theo quan hệ truy vết. Cả hai giữ nhãn và trần CAP_CHARS.
    verify: >
      pytest tests/kg/test_serve.py -k "impact or path"; evo-agents kg query kg_impact
      "symbol:kb-service:src/kb_service/mcp_adapter/asgi.py::Router" --project meridai phải liệt kê
      build_router (cạnh calls, status resolved) và file asgi.py
  - criterion: >
      build --verify khớp hash trên ba dự án meridai, evo-lms, evo-agents sau khi kho lên schema 2; kho
      schema 1 được dựng lại từ nhật ký thay vì báo lỗi; hai Symbol trùng khoá (repo, path, qualname) làm
      build thất bại và in cả hai nguồn.
    verify: >
      pytest tests/kg -k "pg_key or schema_upgrade"; evo-agents kg build --verify --project meridai;
      evo-agents kg build --verify --project evo-lms; evo-agents kg build --verify --project evo-agents
  - criterion: >
      Trên evo-lms, mỗi tài liệu có frontmatter id: khớp một mẫu trong identifiers sinh đúng một cạnh defines
      tới node mã tương ứng; số node Requirement không có defines giảm từ 734 và con số mới nằm trong báo cáo.
      Trên meridai, link tới thư mục phân giải về node Directory và số mention treo của nguồn kb-docs giảm so
      với lượt đo của kg-prototype.
    verify: evo-agents kg status --project evo-lms --json; evo-agents kg status --project meridai --json; báo cáo trong reports/
  - criterion: >
      evo-agents harness validate kiểm ontology.yaml mà knowledge.yaml trỏ tới và in cảnh báo lint quy ước
      định danh; ba harness evo-agents-harness, meridai-harness, evo-lms-harness vẫn 0 lỗi.
    verify: evo-agents harness validate ~/github/evo-agents-harness ~/github/meridai-harness ~/github/evo-lms-harness
  - criterion: >
      LaunchAgent của evo-agents đã nạp trên máy này, chạy `kg sync --due --all --build` mỗi giờ; trong vòng
      hai giờ sau khi cài, audit.jsonl của meridai có bản ghi từ lượt chạy theo lịch, và kg status không còn
      nguồn nào có tuổi vượt refresh cộng một giờ.
    verify: >
      launchctl print gui/$(id -u)/io.github.maycuatroi1.evo-agents.kg-sync; tail -n 5 ~/.evo/kg/meridai/audit.jsonl;
      evo-agents kg status --project meridai
  - criterion: >
      Hook PostToolUse ghi nhãn cao nhất đã đọc vào ~/.evo/kg/sessions/<session_id>.json trong một phiên
      thật. Hook PreToolUse gợi ý chỉ chứa ID và đường dẫn do parser rút ra, tắt được bằng
      EVO_KG_GREP_HINTS=0, và trên ít nhất 50 mẫu tìm kiếm lấy từ transcript meridai có độ trễ p95 không quá
      1,5 giây đo qua đúng lệnh hook của plugin.
    verify: >
      pytest tests/kg/test_hooks.py; báo cáo đo trong reports/ (độ trễ p50 và p95, tỉ lệ có gợi ý, tỉ lệ gợi ý
      đúng trên mẫu 30 gợi ý chấm tay)
  - criterion: Bộ eval của plugin qua bốn ca, gồm ca mới gọi kg_impact trước khi sửa một symbol.
    verify: claude plugin eval plugins/evo-kg --runs 3 --model claude-sonnet-5-5
  - criterion: >
      CI evo-agents xanh trên ubuntu và macos; Harness Validate của evo-lms xanh với ghim evo-ak==0.1.0.
    verify: gh run list --repo maycuatroi1/evo-agents --limit 3; gh run list --repo maycuatroi1/evo-lms-harness --workflow harness-validate.yaml --limit 3

