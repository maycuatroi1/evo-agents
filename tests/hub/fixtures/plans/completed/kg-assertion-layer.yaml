steps:
  - id: 1
    title: 'Lệnh kg bind'
    repo: evo-agents
    what: >
      Thêm `evo-agents kg bind [--project NAME] [DIR]`, `kg bind --list`, `kg bind --remove DIR` trong
      evo_agents/kg/cli.py. Gắn tường minh ghi vào ~/.evo/kg/bound.json (tách khỏi chỉ mục projects.json do
      remember() ghi). resolve_project trong evo_agents/kg/project.py tra theo thứ tự: --project,
      EVO_KG_PROJECT, gắn tường minh của DIR hoặc thư mục tổ tiên gần nhất, harness.yaml tìm từ thư mục, chỉ
      mục projects.json. Hai thông báo lỗi "no project contains" và "belongs to several projects" chỉ tới
      `evo-agents kg bind`. Không có tool MCP nào nhận tham số dự án.
    depends_on: []
    verify: pytest tests/kg -k bind -q
    status: done
    done_at: '2026-10-03'
    evidence: >
      evo-agents@a20956f trên nhánh kg-assertion-layer: kg bind, --list, --remove, ~/.evo/kg/bound.json,
      tests/kg/test_bind.py. Chạy lại: 11 test bind xanh, toàn bộ 56 test xanh, ruff sạch. kg bind không có
      --project thì ghim dự án mà DIR đang phân giải tới; một thư mục đã gắn mà dự án không nạp được thì báo
      lỗi chứ không lùi về harness.yaml. serve.make_session vẫn thêm gợi ý cũ "--project" sau thông báo mới.
    blocking: true
    note: Đóng lệch của step 8 trong kg-prototype; serve và hook đều đi qua resolve_project.
  - id: 2
    title: 'Ontology vào validate và build'
    repo: evo-agents
    what: >
      knowledge_semantics gọi validate_ontology trên file mà khoá ontology của knowledge.yaml trỏ tới (đường
      dẫn tương đối theo thư mục của knowledge.yaml); file thiếu là lỗi. Kiểm thêm: kind của mỗi identifiers
      phải thuộc known_kinds của hub cộng ontology (lỗi). Pipeline nạp ontology qua Project và từ chối fact có
      kind ngoài known_kinds bằng một lỗi build có tên item. Harness không khai khoá ontology thì hành vi giữ
      nguyên, nên ontology.yaml định dạng lms graph của evo-lms (không được knowledge.yaml trỏ tới) không bị
      kiểm.
    depends_on: []
    verify: pytest tests/harness tests/kg -k ontology -q; evo-agents harness validate ~/github/evo-lms-harness
    status: done
    done_at: '2026-10-03'
    evidence: >
      evo-agents@ba65d01, merge vào kg-assertion-layer. Chạy lại: 11 test ontology xanh; validate evo-lms 82
      file, meridai 32 file, evo-agents-harness 6 file, đều 0 lỗi và output -v giống bản 1447e3f; sau merge
      67 test xanh, ruff sạch. Lệch: kiểm kind của identifiers cũng chỉ chạy khi knowledge.yaml có khoá
      ontology, để harness không khai khoá giữ nguyên hành vi; validate_ontology từ chối thêm node_kinds hoặc
      relations không phải danh sách và mục không có tên.
    blocking: true
  - id: 3
    title: 'Khoá PG-Keys cho Symbol và schema kho 2'
    repo: evo-agents
    what: >
      Node Symbol mang props.key = [repo, path, qualname], repo lấy từ khoá repo của nguồn hoặc tên harness
      trong harness.yaml. evo_agents/kg/store.py thêm partial unique index trên (kind, json_extract(props,
      '$.key')) cho kind Symbol, tx_to IS NULL, status khác proposed; nâng SCHEMA_VERSION lên "2". Store gặp
      schema cũ thì build dựng lại kho từ nhật ký vào file mới rồi thay nguyên tử, thay vì RuntimeError. Vi
      phạm khoá làm build thất bại, in khoá và các nguồn đã sinh ra nó. Chạy build trên ba dự án; nếu nguồn
      chồng nhau sinh khoá trùng thì ghi lại ở note của step 16 và 17 để harness đó sửa include/exclude.
    depends_on: []
    verify: >
      pytest tests/kg -k "pg_key or schema_upgrade" -q; evo-agents kg build --verify --project meridai;
      evo-agents kg build --verify --project evo-lms; evo-agents kg build --verify --project evo-agents
    status: done
    done_at: '2026-10-03'
    evidence: >
      evo-agents@dc2a225, merge vào kg-assertion-layer ở evo-agents@98e4ca4 (gỡ xung đột import trong build.py
      với step 2). Chạy lại: 6 test pg_key và schema_upgrade xanh; trên bản sao kho (EVO_KG_HOME trong
      scratchpad, kho thật không đổi) build --verify khớp hash: meridai sha256:040c9179 (19.686 node, 32.476
      cạnh), evo-lms sha256:ade79cae (43.854 node, 73.570 cạnh), evo-agents sha256:7ff71399; cả ba tự dựng lại
      từ schema 1 lên 2. Không có Symbol trùng khoá ở dự án nào, nên step 16 và 17 không cần sửa
      include/exclude. Sau merge 103 test xanh. Thêm: STRUCTURE_VERSION lên 3; serve, query và kg status báo
      kho schema 1 bằng lỗi rõ thay vì traceback; dựng lại do đổi schema làm build_id bắt đầu lại từ 1.
    blocking: true
    note: Đổi schema kho nên phải chứng minh đường dựng lại từ nhật ký trước các step đổi pipeline sau.
  - id: 4
    title: 'Frontmatter id là nơi định nghĩa'
    repo: evo-agents
    what: >
      Chặng cấu trúc đọc frontmatter YAML đầu file markdown; khoá id có giá trị khớp một mẫu trong identifiers
      sinh node mã (cùng id dạng <kind lower>:<mã> như Linker.scan) và cạnh defines từ Document, status parsed.
      kg status liệt kê mã có từ hai nơi defines trở lên, kèm gợi ý dùng derived_from (mục 4.6). Kiểm trên
      evo-lms: số Requirement không có defines trước và sau.
    depends_on: [3]
    verify: pytest tests/kg -k frontmatter -q; evo-agents kg build --project evo-lms && evo-agents kg status --project evo-lms --json
    status: done
    done_at: '2026-10-03'
    evidence: >
      evo-agents@1a15e12, merge vào kg-assertion-layer ở evo-agents@3c9152c (gỡ xung đột hằng số phiên bản với
      step 5; LINK_VERSION lên 7 vì cả hai nhánh cùng nâng 5 lên 6). Chạy lại: 20 test frontmatter xanh. Trên bản
      sao kho evo-lms, Requirement không có defines 734/734 xuống 1/734 (mã còn lại chỉ được một plan step nhắc,
      không tài liệu nào mang nó ở frontmatter); 0 mã có từ hai nơi defines. Sau merge 153 test xanh; build
      --verify khớp trên evo-lms sha256:f30c1d7c (45.562 node, 82.099 cạnh, có cả node Directory) và meridai
      sha256:d0fb9d2a. Thêm: frontmatter có derived_from không defines; link stage bỏ cạnh mentions khi chính
      tài liệu đó đã defines mã.
    blocking: true
  - id: 5
    title: 'Node Directory'
    repo: evo-agents
    what: >
      Thêm hub kind Directory vào HUB_KINDS. Chặng map sinh một node Directory cho mỗi thư mục chứa ít nhất một
      item của nguồn git hoặc harness, cạnh child_of từ File, Document và Directory con tới thư mục cha. Chỉ mục
      định danh nhận đường dẫn thư mục; Linker.path_target phân giải mention đường dẫn kết thúc bằng / hoặc
      trùng một thư mục về node Directory, status parsed. Đo lại mention treo của nguồn kb-docs trên meridai.
    depends_on: [3]
    verify: pytest tests/kg -k directory -q; evo-agents kg build --verify --project meridai
    status: done
    done_at: '2026-10-03'
    evidence: >
      evo-agents@c041ce6, merge vào kg-assertion-layer ở evo-agents@e2505cb. Chạy lại: 7 test directory xanh;
      trên bản sao kho meridai build --verify khớp sha256:474a48d9 (20.119 node, 35.440 cạnh, trước đó 19.686 và
      32.476; thêm 433 node Directory). Mention treo của kb-docs 442 xuống 282 (phân giải 72% lên 81%), tổng
      treo 1.109 xuống 946. Sau merge 133 test xanh. ID dạng dir:<repo>:<path>; gốc repo không có node riêng;
      phần lớn 282 link treo còn lại bắt đầu bằng / (tính từ gốc site docs), step này chưa xử lý.
    blocking: true
  - id: 6
