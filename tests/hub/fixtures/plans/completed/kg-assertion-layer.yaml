  - Tầng đề xuất bằng LLM (chặng đề xuất, kg propose, memo LLM, phép thử P2).
  - Ghi ngược (kg writeback, lens, P9) và phép thử sandbox Lark.
  - Adapter PostgreSQL, phương án DuckDB.
  - Hook PreToolUse chặn kênh ra ngoài; câu 6 ở mục 7 của thiết kế vẫn để mở.
  - Connector mới (Notion, Jira, Google Drive, Lark Drive, scip, lms kg-connector srs, django-introspect)
    và thông điệp "item không đổi" trong kg/1; seam kg-protocol-v1 không đổi trong plan này.
  - O1 (lịch làm mới tối ưu theo nhật ký đọc), webhook.
  - Integrity theo loại trường, nhãn theo nội dung (mẫu secret), truy vấn as-of revision và nối mention về
    revision cũ.
  - kg install --runtime cho Codex, OpenCode, Cursor; chuyển skill harness-engineering sang evo-agents; mọi
    thay đổi trong evo-cli và agent-skills; Windows.
  - Phép thử A/B "có đáng không" trên tác vụ thật.

