    order: 2
    depends_on: [evo-agents]
    status: merged
    merged_into: main
    merged_at: '2026-10-03T00:55:16+07:00'
    scope: lệnh meridai kg-connector lark-wiki (chỉ đọc), knowledge.yaml, bindings/

