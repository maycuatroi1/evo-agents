# Copy of plans/completed/kg-prototype.yaml of the evo-agents-harness repo, taken 2026-10-04, with internal
# names, a personal path and the location of a secret replaced by [redacted]. Test data for tests/hub.
id: kg-prototype
goal: >
  Có một lát cắt dọc chạy được của khung knowledge graph đa nguồn, chỉ gồm phần tất định: một harness
  khai nguồn trong knowledge.yaml, connector nói giao thức kg/1 đổ vào nhật ký, pipeline dựng kho
  SQLite có provenance và nhãn, và agent đọc kho qua MCP. Chạy thật trên meridai-harness với wiki Lark.

created_at: '2026-10-02T11:30:00+07:00'

context: >
  Giai đoạn 1 (reports/Bài toán knowledge graph đa nguồn.md) phát biểu bài toán và các tính chất P1 đến
  P10. Giai đoạn 2 (reports/Thiết kế khung knowledge graph.md) chọn kiến trúc; mục 8 của tài liệu đó là
  phạm vi prototype này. Prototype kiểm phần lõi có định lý đỡ (tầng khẳng định, nhật ký, gộp lattice,
  provenance, nhãn) trước khi đưa LLM vào. Thiết kế ban đầu đặt lõi trong evo-cli; ngày 2026-10-02 lõi
  chuyển sang repo public evo-agents (xem decisions).

acceptance:
  - criterion: >
      evo-agents kg build --verify khớp hash qua ba lượt sync liên tiếp có sửa, thêm và xoá tài liệu.
    verify: pytest tests/kg/test_end_to_end.py -k three_syncs; evo-agents kg build --verify --project meridai
  - criterion: Phép thử xáo trộn và lặp nhật ký cho cùng trạng thái corpus.
    verify: pytest tests/kg/test_corpus.py -k replay
  - criterion: >
      Xoá một section trong fixture rút đúng các cạnh mà đánh giá provenance chỉ ra, không hơn không kém.
    verify: pytest tests/kg/test_end_to_end.py -k section_removal
  - criterion: >
      Phép thử noninterference giữa meridai và một harness thứ hai (evo-agents-harness) cho kết quả MCP
      giống từng byte.
    verify: pytest tests/kg/test_serve.py -k noninterference; chạy lại trên kho thật của meridai
  - criterion: >
      evo-agents kg status in độ phủ theo nguồn và trả exit code khác 0 khi connector Lark bị giết giữa
      chừng, và không có lệnh xoá nào được áp dụng.
    verify: pytest tests/kg/test_corpus.py -k truncated; thử tay bằng kill trên lượt sync thật
  - criterion: >
      claude plugin eval qua ba ca: truy vết yêu cầu tới code, câu hỏi chuỗi chính xác, kết quả chứa
      lệnh chèn.
    verify: claude plugin eval plugins/evo-kg
  - criterion: >
      Đo trên meridai: tỉ lệ liên kết tầng A so với mốc 55% của phép đo regex, thời gian sync và build,
      kích thước kho và bảng provenance. Ghi kết quả vào reports/.
    verify: evo-agents kg status --project meridai --json; báo cáo đo trong reports/

non_goals:
  - Chặng đề xuất bằng LLM, ghi ngược, lịch làm mới tối ưu (O1), adapter PostgreSQL.
  - Connector Notion, Jira, Google Drive.
  - Hook chặn kênh ra ngoài.
  - Sửa evo-cli hay agent-skills. Hai repo này chỉ được đổi sau khi prototype đạt tiêu chí.

references:
  - what: Phạm vi và tiêu chí xong
    where: reports/Thiết kế khung knowledge graph.md, mục 8
  - what: Giao thức kg/1, corpus, pipeline, kho, MCP
    where: reports/Thiết kế khung knowledge graph.md, mục 4.2 đến 4.9
  - what: Định nghĩa D1 đến D11 và tính chất P1 đến P10
    where: reports/Bài toán knowledge graph đa nguồn.md
  - what: Client Lark có sẵn của meridai
    where: meridai-harness src/meridai_cli/lark.py (LarkClient, list_blocks, outline)

