risks:
  - risk: Dữ liệu khách hàng hoặc định danh nội bộ [redacted] lọt vào repo public evo-agents qua fixture hay ví dụ.
    mitigation: >
      Fixture của evo-agents chỉ dùng dữ liệu tự tạo. Cấu hình meridai nằm trong meridai-harness. Trước
      mỗi lần push evo-agents, grep các chuỗi đặc trưng ([redacted]).
  - risk: Corpus của meridai bị ghi vào một repo.
    mitigation: Corpus luôn ở ~/.evo/kg/<project>/ với quyền 0700; test kiểm đường dẫn.
  - risk: Connector Lark đứt giữa chừng và bị hiểu là tài liệu đã xoá.
    mitigation: Chỉ listing kết thúc bằng complete mới sinh lệnh xoá; thêm chốt chặn tỉ lệ 0,3.
  - risk: Sửa meridai-harness đè lên thay đổi chưa commit của phiên khác.
    mitigation: Làm trong git worktree trên nhánh kg-connector-lark-wiki.

rollback: >
  evo-agents là repo mới, không ai phụ thuộc: bỏ nhánh hoặc revert. Ở meridai-harness, xoá nhánh
  kg-connector-lark-wiki và thư mục ~/.evo/kg/meridai/. Không có thay đổi nào trên evo-cli hay
  agent-skills.

assumptions:
  - Bot Lark của meridai đã là member của space wiki tài liệu dự án và có scope wiki đọc (docs/lark.md, kiểm 2026-10-01).
  - SQLite trên máy có FTS5 (kiểm 2026-10-02, SQLite 3.45.3).

decisions:
  - date: '2026-10-02'
    by: user
    decision: >
      Lõi nằm trong repo public evo-agents: package evo_agents, CLI evo-agents, marketplace Claude Code
      với plugin evo-kg; phát hành theo tag riêng. evo-cli giữ nguyên trong prototype.
    why: >
      evo-cli phát một bản PyPI mỗi lần push main và chưa có cơ chế plugin. Đây cũng là câu trả lời cho
      câu 4 và 5 ở mục 7 của thiết kế.
  - date: '2026-10-02'
    by: user
    decision: Sink claude-code@anthropic có clearance tới mức customer cho meridai.
    why: Agent đã đọc tài liệu Lark của [redacted] qua meridai CLI; trả lời câu 2 ở mục 7.
  - date: '2026-10-02'
    by: user
    decision: evo-agents dùng giấy phép Apache-2.0.
    why: Có điều khoản bằng sáng chế; cùng giấy phép với graphify.
  - date: '2026-10-02'
    by: agent
    decision: >
      Câu 1, 3, 6, 7 ở mục 7 không chặn prototype và để mở: GitNexus không dùng trong evo-agents-harness;
      kho evo-lms giữ PostgreSQL; hook chặn kênh ra ngoài nằm ngoài phạm vi; CI chạy Linux và macOS,
      Windows chưa kiểm.
    why: Phạm vi prototype ở mục 8 không đụng tới các phần này.
