risks:
  - risk: Nới schema làm northwind hay evo-agents-harness đổi kết quả validate.
    mitigation: Chỉ thêm khoá và kiểu; chạy validate trên cả ba harness trước khi push.
  - risk: Sửa plan đã xong làm sync_plans.py hay console đọc khác đi.
    mitigation: Chạy tests/test_sync_plans.py và sync_plans.py --dry-run trên nhánh trước khi mở PR.
  - risk: Corpus fabrikam-lms chứa secret commit trong repo ([redacted]).
    mitigation: >
      File .env không thuộc loại file connector git đọc; corpus ở ~/.evo/kg/fabrikam-lms với quyền 0700.
      Kiểm grep trong corpus sau lượt sync đầu.
  - risk: Đè lên thay đổi chưa commit của phiên khác ở ~/github/fabrikam-lms-harness.
    mitigation: Làm trong worktree ~/github/fabrikam-lms-harness-kg trên nhánh evo-agents-migration.

debt:
  - >
    734 mã SRS.<32 hex> thành node Requirement nhưng không có cạnh defines: evo-agents chưa coi frontmatter
    id: là chỗ định nghĩa.
  - >
    [redacted]: một credential thật nằm trong hai repo sản phẩm; corpus chép lại. Cần gắn nhãn secret theo nội dung, và xoay mật khẩu là quyết định của người dùng.
  - >
    e2e chỉ liên kết 19% mention: tài liệu của fabrikam-lms-automation-test trỏ tới file đã chuyển chỗ trên
    origin/main, và thư mục có dấu cách cắt mất đường dẫn.
  - >
    ontology.yaml ở gốc fabrikam-lms-harness theo định dạng của lms graph (từ vựng SRS). Build của evo-agents
    hiện chưa nạp ontology nên không vướng; khi nạp, cần khoá ontology trong knowledge.yaml như đã làm
    với bindings.

rollback: >
  Xoá nhánh fabrikam-lms-migration ở evo-agents, nhánh và worktree evo-agents-migration ở fabrikam-lms-harness,
  thư mục ~/.evo/kg/fabrikam-lms/, và revert commit đăng ký trong evo-agents-harness.

