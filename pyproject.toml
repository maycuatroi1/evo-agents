type = "layers"
containers = ["evo_agents.hub.server.opportunity_evidence"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.opportunity_evidence a route handler only passes the request's parts and the app's engine \
