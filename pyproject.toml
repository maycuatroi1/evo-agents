containers = ["evo_agents.hub.server.intake"]
layers = ["routes", "service", "opportunity_candidates", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.intake a route handler only passes its Scope (evo_agents.hub.server.base.scope) and the \
