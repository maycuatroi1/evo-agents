[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-ak"
dynamic = ["version"]
description = "Shared tooling for agent harnesses: harness schema, multi-source knowledge graph, Claude Code plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "maycuatroi" }]
keywords = ["agents", "harness", "knowledge-graph", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = ["PyYAML>=6.0", "tzdata>=2024.1"]

[project.optional-dependencies]
# import-linter: `lint-imports` checks the package boundaries of [tool.importlinter] below (docs/structure.md).
# basedpyright: pinned, since a new release finds new errors the committed baseline does not hold ([tool.basedpyright]).
# pytest 9.2: under 9.1 a test of tests/hub listed after a file right under tests/ lost the fixtures of
# tests/hub/conftest.py (pytest #14635, tests/test_collection_order.py).
test = ["pytest>=9.2", "pytest-xdist>=3.6", "pytest-timeout>=2.3", "ruff>=0.6", "httpx>=0.27", "moto[server]>=5.1", "import-linter>=2.15", "basedpyright==1.40.2"]
graphify = ["graphifyy==0.9.73"]
# The entities step of a knowledge graph build (evo_agents.kg.entities): the client of an OpenAI-compatible endpoint. A local
# command model needs nothing.
entities = ["openai>=1.40"]
# Clusters of a knowledge graph's build (evo_agents.kg.clusters). Pinned: a build's content hash holds its clusters.
clusters = ["graspologic-native==1.3.1"]
# Search by meaning next to BM25 (evo_agents.kg.semantic): an embedding model run on this machine through ONNX Runtime,
# no third party's API. 0.9: TextEmbedding.add_custom_model with local_files_only. docs/kg-semantic.md.
semantic = ["fastembed>=0.9,<0.10", "numpy>=1.26"]
# `kg bench`: reads the parquet files of the code benches (evo_agents.kg.bench, docs/kg-bench.md); downloads are stdlib.
bench = ["pyarrow>=15"]
# The learned order of kg_search's first results (evo_agents.kg.rank): a LightGBM LambdaMART model that ships in the package
# (kg/rank_model.txt), trained by `kg rank train` on numbers only. Without it kg_search keeps its own order.
rank = ["lightgbm>=4.5", "numpy>=1.26"]
# Edges the graph may lack, proposed by a graph model (evo_agents.kg.links): DistMult or RotatE trained on CPU with numpy alone.
links = ["numpy>=1.26"]
# The reading of archives uploaded to a hub's graph (evo_agents.kg.extract_office): PDF, docx, xlsx, pptx and html to
# markdown. The hub's image installs it; without it those files are kept as assets.
ingest = ["markitdown[pdf,docx,xlsx,pptx]>=0.1"]
hub-server = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    # close_returns: a connection SQLAlchemy closes goes back to the pool (evo_agents.hub.db).
    "psycopg-pool>=3.3",
    "alembic>=1.16",
    # Queries are SQLAlchemy Core on the pool above; the asyncio extra brings greenlet, which 2.1 no longer installs.
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    # 2.12: Field(exclude_if=...) leaves an absent key of the heartbeat answer out (nightly, update_now).
    "pydantic>=2.12",
    "sentry-sdk>=2.20",
    # http2: APNs takes pushes over HTTP/2 alone (evo_agents.hub.server.push.service.native).
    "httpx[http2]>=0.27",
    "boto3==1.42.91",
    # AES-256-GCM of the credentials the hub keeps for runs (evo_agents.hub.server.credentials.models.sealing).
    "cryptography>=44",
    # Pinned: migration 0004 creates the schema of exactly this release (evo_agents/hub/migrations/sql).
    "procrastinate==3.10.0",
    # Five-field crons of the cron jobs of a project, read in their time zone (evo_agents.hub.cron).
    "croniter>=6.0",
    # The worker builds knowledge graphs with the graphify code backend, as the machines that push to it do.
    "evo-ak[graphify]",
    # ...and computes the clusters of each build, so the hub's map has them.
    "evo-ak[clusters]",
    # ...and orders kg_search's files with the learned model when its setting is on (evo_agents.kg.rank).
    "evo-ak[rank]",
    # Pinned: /mcp subclasses MCPServer and mounts its Streamable HTTP app, whose surface still moves within 2.x.
    "mcp==2.3.0",
    # Keyless Sigstore signatures of plugin bundles (evo_agents.plugins.signing): the Verifier and policy API of 4.x.
    "sigstore>=4.5,<5",
    # The optional event bus on RabbitMQ (EVO_HUB_BROKER_URL, evo_agents.hub.bus): publisher confirms, quorum queues.
    "aio-pika>=9.5,<10",
    # The optional shared cache and rate limits on Redis (EVO_HUB_REDIS_URL, evo_agents.hub.cache): redis.asyncio.
    "redis>=8.1,<9",
]
# `evo-agents worker`, the daemon that runs plan steps on a member's machine: aiohttp for its HTTP and websocket,
# and the SDKs of the runtimes its adapters drive.
worker = [
    "aiohttp>=3.9",
    # The versions the runtime adapters were checked with (evo_agents/worker/runtimes); an older one is refused.
    "claude-agent-sdk>=0.2.163",
    "openai-codex>=0.160",
]

[project.urls]
Repository = "https://github.com/maycuatroi1/evo-agents"

[project.scripts]
evo-agents = "evo_agents.cli:main"

[project.entry-points."evo_agents.kg.connectors"]
harness = "evo_agents.kg.connectors.harness:run"
git = "evo_agents.kg.connectors.git:run"

# The core plugins evo-ak ships (evo_agents.core_plugins), which the hub's image therefore has. telegram, chats, crm,
# pm and marketing are evo-agents-core-plugins', which deploy/hub/core-plugins.txt pins into the image. canvas, srs and
# tasks are features of the hub, not plugins: the hub registers them itself (evo_agents.hub.plugin_calls.BUILTIN).
[project.entry-points."evo_agents.plugins"]
browser = "evo_agents.core_plugins.browser:MANIFEST"
builder = "evo_agents.core_plugins.builder:MANIFEST"
guard = "evo_agents.core_plugins.guard:MANIFEST"

# The Python environment a worker's run makes in a worktree of this repo (evo_agents.worker.venvs, docs/workers.md):
# the extras CI tests with and the core plugins the hub's image installs, so `python -m pytest` and `python -m
# evo_agents` see the entry points of the branch and of every core plugin, whatever the machine's own python has.
[tool.evo-agents.worker]
venv = true
extras = ["test", "graphify", "hub-server", "worker", "ingest"]
requirements = ["deploy/hub/core-plugins.txt"]

[tool.setuptools.dynamic]
version = { attr = "evo_agents.__version__" }

[tool.setuptools.packages.find]
include = ["evo_agents*"]

[tool.setuptools.package-data]
evo_agents = [
    "harness/schemas/*.json",
    "kg/strategies/*.yaml",  # the built-in KG strategies (evo_agents.kg.strategy)
    "kg/rank_model.txt",  # the learned order of kg_search (evo_agents.kg.rank), at most 5 MB
    "hub/model_catalog.json",
    "hub/migrations/*.py",
    "hub/migrations/*.mako",
    "hub/migrations/versions/*.py",
    "hub/migrations/sql/*",
    "hub/security_review/*",  # the security pass of every Judge and the license of its source (evo_agents.hub.security_pass)
    "hub/plugin_migrations/*.py",  # the environment of every core plugin's own chain (evo_agents.hub.plugin_schema)
    "hub/plugin_migrations/*.mako",
    "hub/server/static/plugin-kit/*/*",  # the UI kit of plugin pages (evo_agents.hub.server.plugin_ui)
    "core_plugins/*/packs/**/*",  # the agent packs a core plugin ships (evo_agents.plugins.core.image_bundle)
    "core_plugins/*/packs/**/.mcp.json",  # a dotfile no star matches
    "core_plugins/*/cli.json",  # the commands a core plugin adds to the CLI (evo_agents.hub.cli.extensions)
    "core_plugins/*/ui/**/*",  # the files of a core plugin's framed pages (manifest key ui)
    "hub/server/*/packs/**/*",  # the agent packs of the features canvas and srs (@strategist, @ba)
    "hub/server/*/packs/**/.mcp.json",
    "worker/bootstrap.sh",  # a link to deploy/worker/bootstrap.sh, copied in as a file (`worker pool user-data`)
]

# Types of evo_agents, checked by `python -m basedpyright` (docs/structure.md, section Type check). What it found when the
# check came in is frozen in tests/type_baseline.json, which only shrinks: `pytest -m structure tests/test_structure.py`
# fails a change whose baseline holds more than main's, or anything in a module main's baseline does not name.
[tool.basedpyright]
include = ["evo_agents"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
baselineFile = "tests/type_baseline.json"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ruff format wraps what it can at line-length; what is left is cosmetic
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests import pytest fixtures and take them as parameters of the same name
"tests/**" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "empty_db: hub_db is an empty database, not a copy of the migrated template (tests/hub/conftest.py)",
    "structure: evo_agents against its structure budgets (tests/test_structure.py); runs only with -m structure",
    "gateway_image: the model gateway's client against the pinned OmniRoute image (tests/hub/test_gateway_image.py); skipped without Docker",
    "wall_clock: a budget of elapsed time on the machine that runs it (how fast, not whether something waits); the release gate leaves it out",
]
# The structure budgets are not part of the suite: the lint job of the full ci (a v* tag) runs them, and so can you
# (docs/structure.md): `python -m pytest -m structure tests/test_structure.py`. Another -m replaces this one.
# The wall_clock tests run here, and in the ci job wall-clock, which reports them and never fails: on a CI runner that
# shares its CPUs with three other xdist workers, a 500 ms budget took 822 to 940 ms (v0.73.4 to v0.73.6) and stopped
# release cycle #41 on the same test twice.
addopts = ["-m", "not structure"]
# A test that runs longer fails with the stacks of its threads (pytest-timeout) instead of holding its job.
timeout = 300
# Read by pytest-asyncio when it is installed (the tests do not need it); tests/conftest.py declares the option
# otherwise, so pytest does not warn about an unknown key.
asyncio_default_fixture_loop_scope = "function"

# Boundaries between the packages of evo_agents, checked by `lint-imports` (docs/structure.md, section Package
# boundaries). Each contract's ignore_imports lists the imports that break it today: those lists only shrink, and
# `pytest -m structure tests/test_structure.py` fails a change that adds an entry main does not have.
[tool.importlinter]
root_package = "evo_agents"

[[tool.importlinter.contracts]]
id = "worker-not-hub-server"
name = "The worker does not import evo_agents.hub.server"
type = "forbidden"
source_modules = ["evo_agents.worker"]
forbidden_modules = ["evo_agents.hub.server"]
broken_contract_guidance = """\
The worker runs on members' machines without the hub-server extra, so nothing it imports may reach \
evo_agents.hub.server. Move what both need into a module outside evo_agents.hub.server (evo_agents.hub.runs holds \
the run protocol both sides share), or ask the hub over HTTP. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "kg-not-hub-or-worker"
name = "evo_agents.kg, outside its CLI, imports neither evo_agents.hub nor evo_agents.worker"
type = "forbidden"
source_modules = ["evo_agents.kg"]
forbidden_modules = ["evo_agents.hub", "evo_agents.worker"]
ignore_imports = [
    # The CLI of the knowledge graph: `kg` commands that push to the hub, read its graphs, ask it for a build, or have it
    # prune or scrub a project.
    "evo_agents.kg.cli.** -> evo_agents.hub.**",
]
broken_contract_guidance = """\
The knowledge graph builds and serves on a core install, without the hub or the worker. Keep the hub's side in \
evo_agents.hub (cli.kg, kg_push, kg_build) and have it call evo_agents.kg, not the reverse; a type both need goes \
into evo_agents.kg. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-server-from-hub-server"
name = "Outside evo_agents.hub.server, evo_agents.hub imports evo_agents.hub.server only where it does today"
type = "forbidden"
source_modules = ["evo_agents.hub.*"]
forbidden_modules = ["evo_agents.hub.server"]
ignore_imports = [
    # `hub serve` and `hub openapi` start or dump the app; `hub worker` takes Sentry and the release pass from it.
    "evo_agents.hub.cli -> evo_agents.hub.server.app",
    "evo_agents.hub.openapi -> evo_agents.hub.server.app",
    # The audit row of a pruned graph build.
    "evo_agents.hub.kg_prune -> evo_agents.hub.server.audit",
    # The notice to a project's admins that its graph builds stopped being queued.
    "evo_agents.hub.kg_build -> evo_agents.hub.server.notifications.service.deliveries",
    # `hub deliver`, the event bus's delivery process, runs the pass of the notifications.
    "evo_agents.hub.deliverer -> evo_agents.hub.server.notifications.service.deliveries",
    # `hub worker`, the hub's job runner, runs jobs whose code lives with the server.
    "evo_agents.hub.worker -> evo_agents.hub.server.brief",
    "evo_agents.hub.worker -> evo_agents.hub.server.changes.service.job",
    "evo_agents.hub.worker -> evo_agents.hub.server.collect",
    "evo_agents.hub.worker -> evo_agents.hub.server.context_answer_reuse",
    "evo_agents.hub.worker -> evo_agents.hub.server.curator.service.shift",
    "evo_agents.hub.worker -> evo_agents.hub.server.digests.service.sessions",
    "evo_agents.hub.worker -> evo_agents.hub.server.forge.client.github_app",
    "evo_agents.hub.worker -> evo_agents.hub.server.merge.service.ancestry",
    "evo_agents.hub.worker -> evo_agents.hub.server.merge.service.check",
    "evo_agents.hub.worker -> evo_agents.hub.server.market.service.install",
    "evo_agents.hub.worker -> evo_agents.hub.server.market.service.licenses",
    "evo_agents.hub.worker -> evo_agents.hub.server.opportunity_deadlines",
    "evo_agents.hub.worker -> evo_agents.hub.server.notifications.service.deliveries",
    "evo_agents.hub.worker -> evo_agents.hub.server.outcomes",
    "evo_agents.hub.worker -> evo_agents.hub.server.run_reaper",
    "evo_agents.hub.worker -> evo_agents.hub.server.credentials.models.sealing",
    "evo_agents.hub.worker -> evo_agents.hub.server.seller.service.signals",
    "evo_agents.hub.worker -> evo_agents.hub.server.webhooks.service.delivery",
]
broken_contract_guidance = """\
The client side of evo_agents.hub (CLI commands, client, MCP proxy, plugin hooks) installs without the hub-server \
extra and must not load the server. Move what both sides need out of evo_agents.hub.server into a module of \
evo_agents.hub the server imports, or call the API over HTTP. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-server-not-cli"
name = "evo_agents.hub.server does not import the commands of evo_agents.hub.cli"
type = "forbidden"
source_modules = ["evo_agents.hub.server"]
forbidden_modules = ["evo_agents.hub.cli"]
broken_contract_guidance = """\
The server runs the hub's API, and evo_agents.hub.cli holds the commands that call it: a command imports what it \
shares with the server, never the reverse. Move the code the server needs out of the command into a module of its \
own outside evo_agents.hub.cli (evo_agents.hub.plan_writes is one), and have the command import it from there. See \
docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-runs-layers"
name = "The run API of the hub goes from its routes to its service to its repository to its models, never back"
type = "layers"
containers = ["evo_agents.hub.server.runs"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.runs a route handler only passes the request's parts to a public function of the service, \
which checks and decides; the repository reads and moves runs with SQLAlchemy Core on evo_agents.hub.tables; the \
models import none of them. Move the code that reaches up into the layer that needs it: a check into the service, a \
query into the repository, a shape or a limit into the models. Other modules import the service and the models, never \
the routes. A new module of the package goes into one of the four layers. See docs/structure.md, section Package \
boundaries."""

[[tool.importlinter.contracts]]
id = "hub-kg-layers"
name = "The knowledge graph API of the hub goes from its routes to its service to its repository to its models, never back"
type = "layers"
containers = ["evo_agents.hub.server.kg"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.kg a route handler only passes its Scope or its transaction and the request's parts to a \
public function of the service, which checks and decides; the repository reads and writes the tables; the models \
import none of them. Move the code that reaches up into the layer that needs it: a check or a message into the \
service, a query into the repository, a shape or a limit into the models. Other modules import the service and the \
models, never the routes. A new module of the package goes into one of the four layers. See docs/structure.md, \
section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-goals-layers"
name = "The goals of a project go from their routes to their service to their repository to their models, never back"
type = "layers"
containers = ["evo_agents.hub.server.goals"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.goals a route handler only passes its Scope (evo_agents.hub.server.base.scope) and the \
request's parts to a public function of the service, which checks and decides; the repository (GoalStore, a \
RevisionedStore) reads and writes the tables; the models import none of them. Move the code that reaches up into \
the layer that needs it: a check or a message into the service, a query into the repository, a shape or a limit into \
the models. Other modules import the service and the models, never the routes. A new module of the package goes into \
one of the four layers. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-problems-layers"
name = "The problems of a project go from their routes to their service to their repository to their models, never back"
type = "layers"
containers = ["evo_agents.hub.server.problems"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.problems a route handler only passes its Scope (evo_agents.hub.server.base.scope) and the \
request's parts to a public function of the service, which checks and decides; the repository (ProblemStore, a \
RevisionedStore) reads and writes the tables; the models import none of them. Move the code that reaches up into \
the layer that needs it: a check or a message into the service, a query into the repository, a shape or a limit into \
the models. Other modules import the service and the models, never the routes. A new module of the package goes into \
one of the four layers. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-opportunities-layers"
name = "The opportunities of a project go from their routes to their service to their repository to their models, never back"
type = "layers"
containers = ["evo_agents.hub.server.opportunities"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.opportunities a route handler only passes its Scope (evo_agents.hub.server.base.scope) and the \
request's parts to a public function of the service, which checks and decides; the repository (OpportunityStore, a \
RevisionedStore) reads and writes the tables; the models import none of them. Move the code that reaches up into \
the layer that needs it: a check or a message into the service, a query into the repository, a shape or a limit into \
the models. Other modules import the service and the models, never the routes. A new module of the package goes into \
one of the four layers. See docs/structure.md, section Package boundaries."""

[[tool.importlinter.contracts]]
id = "hub-problem-evidence-layers"
name = "The evidence of a problem goes from its routes to its service to its repository to its models, never back"
type = "layers"
containers = ["evo_agents.hub.server.problem_evidence"]
layers = ["routes", "service", "repository", "models"]
exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.problem_evidence a route handler only passes the request's parts and the app's engine to a \
public function of the service, which opens the transaction (UnitOfWork), checks and decides; the repository \
