exhaustive = true
broken_contract_guidance = """\
In evo_agents.hub.server.history a route handler (routes) or an MCP tool (mcp) only passes its Scope \
(evo_agents.hub.server.base.scope) and the request's parts to a public function of the service (readers, runs, \
