# The evo-agents hub in production: api, worker, plugins and web built from the checkout this file is in. The
# platform runs `docker compose up -d --build`, which .github/workflows/deploy.yml has it do for main once ci passes.
# The images carry the names GitHub Actions publishes on GHCR for each release (.github/workflows/images.yml),
# tagged EVO_HUB_VERSION, so `up` without --build pulls that release and builds only when GHCR lacks the tag. Postgres
# is not in this file: the hub expects a database it can reach at EVO_HUB_DSN, such as one the platform manages, on
# the network EVO_HUB_PLATFORM_NETWORK.
# A reverse proxy in front sends /v1 and /mcp to api:8080 and everything else to web:3000, on one domain. The /v1
# rule carries the web terminal's websockets too, so the proxy must pass a websocket upgrade there.
# docs/hub.md describes every variable; deploy/hub/.env.example lists them. x-hub-environment passes every variable
# evo_agents/hub/config.py reads, but those the image sets and those only tests change (tests/hub/test_compose.py); an
# empty value is unset, so the hub takes its own default.
#
# The volumes are caches only: the state lives in Postgres and the blob store (R2), and a lost volume is rebuilt.
#
# No variable is required when the file is read, so `docker compose ps` and `down` work without the environment.
# Unset EVO_HUB_VERSION tags the images unset-EVO_HUB_VERSION, which names the variable; unset EVO_HUB_DSN stops api
# and worker with a log line naming it.

name: evo-agents-hub

x-hub-environment: &hub-environment
  EVO_HUB_DSN: ${EVO_HUB_DSN:-}
  EVO_HUB_ADMINS: ${EVO_HUB_ADMINS:-}
  EVO_HUB_GITHUB_CLIENT_ID: ${EVO_HUB_GITHUB_CLIENT_ID:-}
  EVO_HUB_GITHUB_CLIENT_SECRET: ${EVO_HUB_GITHUB_CLIENT_SECRET:-}
  EVO_HUB_SESSION_SECRET: ${EVO_HUB_SESSION_SECRET:-}
  EVO_HUB_PUBLIC_URL: ${EVO_HUB_PUBLIC_URL:-}
  EVO_HUB_S3_ENDPOINT: ${EVO_HUB_S3_ENDPOINT:-}
  EVO_HUB_S3_BUCKET: ${EVO_HUB_S3_BUCKET:-}
  EVO_HUB_S3_ACCESS_KEY_ID: ${EVO_HUB_S3_ACCESS_KEY_ID:-}
  EVO_HUB_S3_SECRET_ACCESS_KEY: ${EVO_HUB_S3_SECRET_ACCESS_KEY:-}
  EVO_HUB_S3_INTERNAL_ENDPOINT: ${EVO_HUB_S3_INTERNAL_ENDPOINT:-}
  EVO_HUB_SENTRY_DSN: ${EVO_HUB_SENTRY_DSN:-}
  EVO_HUB_LOG_LEVEL: ${EVO_HUB_LOG_LEVEL:-INFO}
  EVO_HUB_BLOB_CONCURRENCY: ${EVO_HUB_BLOB_CONCURRENCY:-32}
  EVO_HUB_KG_KEEP_ARTIFACTS: ${EVO_HUB_KG_KEEP_ARTIFACTS:-3}
  EVO_HUB_RUN_LOG_DAYS: ${EVO_HUB_RUN_LOG_DAYS:-30}
  EVO_HUB_AUDIT_DAYS: ${EVO_HUB_AUDIT_DAYS:-}
  EVO_HUB_TRANSCRIPT_DAYS: ${EVO_HUB_TRANSCRIPT_DAYS:-}
  EVO_HUB_SIGNAL_DAYS: ${EVO_HUB_SIGNAL_DAYS:-}
  EVO_HUB_POOL_MIN_SIZE: ${EVO_HUB_POOL_MIN_SIZE:-}
  EVO_HUB_POOL_MAX_SIZE: ${EVO_HUB_POOL_MAX_SIZE:-}
  EVO_HUB_POOL_TIMEOUT: ${EVO_HUB_POOL_TIMEOUT:-}
  EVO_HUB_RUN_LEASE_SECONDS: ${EVO_HUB_RUN_LEASE_SECONDS:-}
  EVO_HUB_DECISION_WAIT_SECONDS: ${EVO_HUB_DECISION_WAIT_SECONDS:-}
  EVO_HUB_WEB_TIME_ZONE: ${EVO_HUB_WEB_TIME_ZONE:-Asia/Ho_Chi_Minh}
  EVO_HUB_FORWARDED_ALLOW_IPS: ${EVO_HUB_FORWARDED_ALLOW_IPS:-}
  EVO_HUB_SECRETS_KEY: ${EVO_HUB_SECRETS_KEY:-}
  EVO_HUB_GITHUB_APP_ID: ${EVO_HUB_GITHUB_APP_ID:-}
  EVO_HUB_GITHUB_APP_PRIVATE_KEY: ${EVO_HUB_GITHUB_APP_PRIVATE_KEY:-}
  EVO_HUB_CURATOR_APP_ID: ${EVO_HUB_CURATOR_APP_ID:-}
  EVO_HUB_CURATOR_APP_PRIVATE_KEY: ${EVO_HUB_CURATOR_APP_PRIVATE_KEY:-}
  EVO_HUB_TELEGRAM_BOT_TOKEN: ${EVO_HUB_TELEGRAM_BOT_TOKEN:-}
  EVO_HUB_TELEGRAM_WEBHOOK_SECRET: ${EVO_HUB_TELEGRAM_WEBHOOK_SECRET:-}
  EVO_HUB_VAPID_PRIVATE_KEY: ${EVO_HUB_VAPID_PRIVATE_KEY:-}
  EVO_HUB_VAPID_SUBJECT: ${EVO_HUB_VAPID_SUBJECT:-}
  EVO_HUB_APNS_KEY_ID: ${EVO_HUB_APNS_KEY_ID:-}
  EVO_HUB_APNS_TEAM_ID: ${EVO_HUB_APNS_TEAM_ID:-}
  EVO_HUB_APNS_PRIVATE_KEY: ${EVO_HUB_APNS_PRIVATE_KEY:-}
  EVO_HUB_FCM_SERVICE_ACCOUNT: ${EVO_HUB_FCM_SERVICE_ACCOUNT:-}
  EVO_HUB_PLUGIN_PUBLISHERS: ${EVO_HUB_PLUGIN_PUBLISHERS:-}
  EVO_HUB_PLUGIN_CORE_PUBLISHERS: ${EVO_HUB_PLUGIN_CORE_PUBLISHERS:-}
  EVO_HUB_PLUGIN_PUBLISHERS_LOCKED: ${EVO_HUB_PLUGIN_PUBLISHERS_LOCKED:-false}
  EVO_HUB_MARKET_DEFAULT_SOURCE: ${EVO_HUB_MARKET_DEFAULT_SOURCE:-maycuatroi1/evo-agents-market}
  EVO_HUB_SELLER_ID: ${EVO_HUB_SELLER_ID:-}
  EVO_HUB_SELLER_KEY: ${EVO_HUB_SELLER_KEY:-}
  EVO_HUB_SELLER_PAYMENT_INSTRUCTIONS: ${EVO_HUB_SELLER_PAYMENT_INSTRUCTIONS:-}
  EVO_HUB_SELLER_SIGNAL_PROJECT: ${EVO_HUB_SELLER_SIGNAL_PROJECT:-}
  EVO_HUB_PLUGIN_HOST_URL: ${EVO_HUB_PLUGIN_HOST_URL:-}
  EVO_HUB_PLUGIN_HOST_TOKEN: ${EVO_HUB_PLUGIN_HOST_TOKEN:-}

# The model gateway's variables (evo_agents/hub/config.py): the api alone takes them beside x-hub-environment, since
# only the api calls the gateway. Without EVO_HUB_GATEWAY_SECRET the gateway is off.
x-gateway-environment: &gateway-environment
  EVO_HUB_GATEWAY_URL: ${EVO_HUB_GATEWAY_URL:-}
  EVO_HUB_GATEWAY_SECRET: ${EVO_HUB_GATEWAY_SECRET:-}

# api, worker and plugins run one image, built from one definition. Beside the core plugins deploy/hub/core-plugins.txt
# pins, the build installs a hub's own: the requirements of EVO_HUB_EXTRA_CORE_PLUGINS, from the index of
# EVO_HUB_CORE_PLUGIN_INDEX_URL, else PyPI (docs/hub-deployment.md, section Core plugins in the image). The index URL
# may hold a credential, so it reaches the build as the secret core_plugin_index alone, never an argument (which
# `docker history` shows) nor the environment of a service; neither variable is in x-hub-environment.
x-hub-build: &hub-build
  context: ../..
  dockerfile: deploy/hub/Dockerfile
  args:
    EVO_HUB_EXTRA_CORE_PLUGINS: ${EVO_HUB_EXTRA_CORE_PLUGINS:-}
  secrets: [core_plugin_index]

x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  api:
    <<: *hardening
    image: ghcr.io/maycuatroi1/evo-agents-hub:${EVO_HUB_VERSION:-unset-EVO_HUB_VERSION}
    build: *hub-build
    restart: unless-stopped
    environment:
      <<: [*hub-environment, *gateway-environment]
    volumes:
      - api-cache:/cache
    expose: ["8080"]
    networks:
      default:
        aliases: [evo-agents-hub-api]
      platform: {}
      gateway: {}
    # The image's HEALTHCHECK, stated here so the platform shows it: liveness only (/v1/health/live), never /v1/health,
    # which would mark the api dead during an R2 outage while it still answers kg_* from its cache.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health/live', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 15s

  worker:
    <<: *hardening
    image: ghcr.io/maycuatroi1/evo-agents-hub:${EVO_HUB_VERSION:-unset-EVO_HUB_VERSION}
    build: *hub-build
    command: ["evo-agents", "hub", "worker", "--data-dir", "/cache"]
    restart: unless-stopped
    environment: *hub-environment
    volumes:
      - worker-cache:/cache
    networks:
      default: {}
      platform: {}
    # Knowledge graph builds are heavy; these limits keep them from starving the other services on the machine.
    cpus: ${EVO_HUB_WORKER_CPUS:-2}
    mem_limit: ${EVO_HUB_WORKER_MEMORY:-4g}
    # The worker serves no HTTP, so the image's healthcheck does not apply; it exits non-zero when it loses Postgres
    # and the restart policy brings it back.
    healthcheck:
      disable: true
    # The worker gives running jobs 25 s after SIGTERM before aborting them.
    stop_grace_period: 40s
    depends_on:
      api:
        condition: service_healthy

  # The backends of isolated plugins run here, not in api or worker (docs/plugins.md). This service gets none of the
  # hub's variables (no *hub-environment): no DSN, no EVO_HUB_SECRETS_KEY, no blob store keys. It takes only the shared
  # secret, pulls the installed plugins from the api, and runs each backend in a process of its own built from nothing.
  # It runs as root with only SETUID, SETGID, CHOWN and KILL, so each backend gets a user of its own: no plugin reads,
  # writes or signals another's, nor this service's /proc. Not as root it would start no backend. pip runs under the
  # backend's user too, from the wheels of the bundle only. The volume is mounted at /plugins, a directory of the image
  # that root owns, because root here has neither CAP_DAC_OVERRIDE nor CAP_FOWNER and cannot enter /cache (hub's,
  # 0750). Without EVO_HUB_PLUGIN_HOST_TOKEN it runs no backend and answers only its health check. Its limits bound
  # every backend together; each backend also has limits of its own (open files, memory, 128 processes of its user).
  # 2048 pids: fifteen backends at their own limit leave 128 to the host, which kills a plugin's processes without
  # starting one of its own.
  plugins:
    <<: *hardening
    image: ghcr.io/maycuatroi1/evo-agents-hub:${EVO_HUB_VERSION:-unset-EVO_HUB_VERSION}
    build: *hub-build
    command: ["evo-agents", "hub", "plugin-host", "--hub-url", "http://evo-agents-hub-api:8080", "--data-dir", "/plugins"]
    restart: unless-stopped
    user: "0:0"
    working_dir: /plugins
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    environment:
      EVO_HUB_PLUGIN_HOST_TOKEN: ${EVO_HUB_PLUGIN_HOST_TOKEN:-}
      EVO_HUB_LOG_LEVEL: ${EVO_HUB_LOG_LEVEL:-INFO}
    volumes:
      - plugins-cache:/plugins
    networks:
      default:
        aliases: [evo-agents-hub-plugins]
    expose: ["8090"]
    cpus: ${EVO_HUB_PLUGINS_CPUS:-1}
    mem_limit: ${EVO_HUB_PLUGINS_MEMORY:-2g}
    pids_limit: ${EVO_HUB_PLUGINS_PIDS:-2048}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy

  # The model gateway, OmniRoute pinned by digest (docs/hub.md, section Model gateway; the version is GATEWAY_VERSION of
  # evo_agents/hub/model_catalog.py). Only the api calls it: it publishes no port, has no domain, and is on the network
  # gateway alone, which the api joins, so neither the dashboard nor the management API is on the internet and the
  # gateway has no route to the database (platform) or to web (default). It takes EVO_HUB_GATEWAY_SECRET and nothing
  # else of the hub's; the entrypoint derives OmniRoute's own secrets and dashboard password from it (each the
  # HMAC-SHA256 of "evo-hub-gateway/<label>" under it, as evo_agents/hub/server/gateway_client.py derives the
  # password), drops it, and starts the gateway. Unset, the service exits at once and the hub runs without a gateway.
  # Every request needs a key (REQUIRE_API_KEY), and no request or response body is logged: request logs are off and
  # every key the hub makes is noLog. The volume holds what the hub reconciles into it; a lost one is rebuilt.
  gateway:
    <<: *hardening
    image: diegosouzapw/omniroute:3.8.52@sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${EVO_HUB_GATEWAY_SECRET:-}" ]; then echo "gateway off: EVO_HUB_GATEWAY_SECRET is not set"; exit 0; fi
        derived=$$(node -e 'const c = require("crypto"); const s = process.env.EVO_HUB_GATEWAY_SECRET; for (const [n, l] of [["JWT_SECRET", "jwt"], ["API_KEY_SECRET", "api-key"], ["STORAGE_ENCRYPTION_KEY", "storage"], ["INITIAL_PASSWORD", "password"]]) console.log("export " + n + "=" + c.createHmac("sha256", s).update("evo-hub-gateway/" + l).digest("hex"))') || exit 1
        eval "$$derived"
        unset derived EVO_HUB_GATEWAY_SECRET
        exec /app/check-permissions.sh node dev/run-standalone.mjs
    command: []
    environment:
      EVO_HUB_GATEWAY_SECRET: ${EVO_HUB_GATEWAY_SECRET:-}
      REQUIRE_API_KEY: "true"
      ENABLE_REQUEST_LOGS: "false"
      APP_LOG_TO_FILE: "false"
      OMNIROUTE_DISABLE_CLI_TOKEN: "true"
    volumes:
      - gateway-data:/app/data
    expose: ["20128"]
    networks:
      gateway:
        aliases: [evo-agents-hub-gateway]
    cpus: ${EVO_HUB_GATEWAY_CPUS:-1}
    mem_limit: ${EVO_HUB_GATEWAY_MEMORY:-1536m}
    stop_grace_period: 15s

  web:
    <<: *hardening
    image: ghcr.io/maycuatroi1/evo-agents-hub-web:${EVO_HUB_VERSION:-unset-EVO_HUB_VERSION}
    # Without build arguments, as images.yml builds it: the /v1 rewrite goes to http://api:8080 (web/Dockerfile).
    build:
      context: ../../web
    restart: unless-stopped
    environment:
      EVO_HUB_API_INTERNAL_URL: ${EVO_HUB_API_INTERNAL_URL:-http://evo-agents-hub-api:8080}
      EVO_HUB_WEB_TIME_ZONE: ${EVO_HUB_WEB_TIME_ZONE:-Asia/Ho_Chi_Minh}
    expose: ["3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/icon.svg').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_started

volumes:
  api-cache:
  worker-cache:
  plugins-cache:
  gateway-data:

# The build's only secret, from the environment compose reads (the platform's, or .env next to this file); unset, the
# build finds no secret and pip uses PyPI.
secrets:
  core_plugin_index:
    environment: EVO_HUB_CORE_PLUGIN_INDEX_URL

networks:
  # Where the database is: on Dokploy, the shared network its databases join. Services without a domain (the
  # worker) are not attached to it by the platform, so this file attaches api and worker itself.
  platform:
    name: ${EVO_HUB_PLATFORM_NETWORK:-dokploy-network}
    external: true
  # The model gateway's own: the gateway and the api, nothing else. Not internal, since the gateway calls the
  # providers' APIs on the internet. Its subnet is stated, outside Docker's default pools (172.17.0.0/12 and
  # 192.168.0.0/16), because a host whose pools are all taken refuses to create a network without one; set
  # EVO_HUB_GATEWAY_SUBNET when the default overlaps a network of the host.
  gateway:
    ipam:
      config:
        - subnet: ${EVO_HUB_GATEWAY_SUBNET:-10.231.128.0/28}
